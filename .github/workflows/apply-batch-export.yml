name: Apply batch attachment export
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: python3 tools/add-batch-export-ui.py
      - name: Patch export
        run: python3 tools/add-batch-export-core.py
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('silent-camera-safari.html').read_text()
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          rm tools/add-batch-export-ui.py tools/add-batch-export-core.py .github/workflows/apply-batch-export.yml
          git config user.name "chatgpt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add batch attachment export and sharing"
          git push
