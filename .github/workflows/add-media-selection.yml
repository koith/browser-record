name: Add attachment selection export
on:
  push:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/add-media-selection.py
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('silent-camera-safari.html').read_text()
          Path('/tmp/app.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])
          PY
          node --check /tmp/app.js
      - run: |
          rm tools/add-media-selection.py .github/workflows/add-media-selection.yml
          git config user.name chatgpt-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add per-attachment export selection"
          git push
