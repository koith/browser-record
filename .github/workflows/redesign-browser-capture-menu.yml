name: Redesign browser capture menu
on: [push, workflow_dispatch]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/redesign-browser-capture-menu.py
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('silent-camera-safari.html').read_text()
          for x in ['radialMenu','radialCamera','radialAudio','modeToggle','syncModeToggle']:
              assert x in s,x
          assert 'id="brGo"' not in s
          Path('/tmp/app.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])
          PY
          node --check /tmp/app.js
      - run: |
          rm tools/redesign-browser-capture-menu.py .github/workflows/redesign-browser-capture-menu.yml
          git config user.name chatgpt-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: redesign browser capture radial menu and mode toggle"
          git push