name: Fix viewer URL isolation
on:
  push:
    paths:
      - '.github/workflows/fix-viewer-url-isolation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore pre-regression app file
        run: git checkout 390e2d09588ff31ac28a7534bfd080fa604786a3 -- silent-camera-safari.html
      - name: Apply isolated viewer object URL patch
        run: python3 tools/fix_viewer_url_isolation.py
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('silent-camera-safari.html').read_text(encoding='utf-8')
          a=s.rfind('<script>'); b=s.rfind('</script>')
          if a<0 or b<a: raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit app fix and remove temp files
        run: |
          rm .github/workflows/fix-viewer-url-isolation.yml tools/fix_viewer_url_isolation.py
          git config user.name 'chatgpt-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: isolate viewer media URLs from thumbnails'
          git push origin main
