name: Apply thumbnail recovery v2
on:
  push:
    paths:
      - '.github/workflows/fix-thumbnail-recovery-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch list/editor thumbnail recovery
        run: python3 tools/fix_thumbnail_v2.py
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('silent-camera-safari.html').read_text()
          a=s.rfind('<script>'); b=s.rfind('</script>')
          if a<0 or b<a: raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(s[a+8:b])
          PY
          node --check /tmp/app.js
      - name: Commit fix and remove temporary files
        run: |
          rm .github/workflows/fix-thumbnail-recovery-v2.yml tools/fix_thumbnail_v2.py
          git config user.name 'chatgpt-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: recover list thumbnails from blobs after playback'
          git push origin main
