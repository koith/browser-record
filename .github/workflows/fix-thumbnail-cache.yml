name: Apply thumbnail cache fix

on:
  push:
    paths:
      - '.github/workflows/fix-thumbnail-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch blob URL cache lifecycle
        shell: python
        run: |
          from pathlib import Path
          p = Path('silent-camera-safari.html')
          s = p.read_text(encoding='utf-8')

          old1 = """function recoverThumb(imgEl, blob){\n  try{\n    if(!blob){ return; }\n    urlCache.delete(blob);\n    const u=URL.createObjectURL(blob);\n    urlCache.set(blob,u);\n    if(!imgEl.dataset.recovered){ imgEl.dataset.recovered='1'; imgEl.src=u; }\n  }catch(e){}\n}\n"""
          new1 = """function recoverThumb(imgEl, blob){\n  try{\n    if(!blob){ return; }\n    urlCache.delete(blob);\n    const u=URL.createObjectURL(blob);\n    urlCache.set(blob,u);\n    if(!imgEl.dataset.recovered){ imgEl.dataset.recovered='1'; imgEl.src=u; }\n  }catch(e){}\n}\n// iOS can invalidate an object URL after a media element has played it even when\n// the Blob itself is still valid. Never carry those cached URLs across viewer/editor\n// teardown; force the next render to mint fresh URLs from the stored Blobs.\nfunction invalidateMediaURLs(m){\n  if(!m)return;\n  if(m.blob){ urlCache.delete(m.blob); m._url=''; }\n  if(m.poster){ urlCache.delete(m.poster); m._purl=''; }\n}\nfunction invalidateNoteMedia(note){\n  (note&&note.media||[]).forEach(invalidateMediaURLs);\n}\n"""
          if old1 not in s:
              raise SystemExit('recoverThumb anchor not found')
          s = s.replace(old1, new1, 1)

          old2 = """function closeEditor(silent){\n  closeCamera(); editor.classList.remove('open'); current=null;\n  if(view==='notes'){ $('btnNew').style.display='flex'; $('subbar').classList.remove('hidden'); }\n  $('btnSave').style.display='none';\n  if(!silent && view==='notes') renderNotes();\n}\n"""
          new2 = """function closeEditor(silent){\n  closeCamera();\n  // Do not let viewer-used object URLs leak into the note-list thumbnails.\n  // The Blobs stay in IndexedDB; only their disposable URL cache is cleared.\n  if(current) invalidateNoteMedia(current);\n  editor.classList.remove('open'); current=null;\n  if(view==='notes'){ $('btnNew').style.display='flex'; $('subbar').classList.remove('hidden'); }\n  $('btnSave').style.display='none';\n  if(!silent && view==='notes') renderNotes();\n}\n"""
          if old2 not in s:
              raise SystemExit('closeEditor anchor not found')
          s = s.replace(old2, new2, 1)

          old3 = """function closeViewer(){\n  cancelAnimationFrame(vwRaf);\n  // pause only — do NOT removeAttribute('src')/load(), that can invalidate the\n  // blob URL shared with the list/editor thumbnails and break them.\n  const vid=document.getElementById('vwVideo');\n  if(vid){ try{ vid.pause(); }catch(e){} }\n  viewer.classList.remove('open');\n  vwMedia.innerHTML='';\n  $('vwCtrl').style.display='none';\n  viewerIndex=-1;\n  try{ sheetBg.classList.remove('open'); sheetHost.innerHTML=''; }catch(e){}\n}\n"""
          new3 = """function closeViewer(){\n  cancelAnimationFrame(vwRaf);\n  // pause only — do NOT removeAttribute('src')/load(); iOS may invalidate the\n  // shared object URL. After teardown we deliberately forget the cached URL and\n  // rebuild editor thumbnails from the original Blob.\n  const viewed=(current&&current.media&&viewerIndex>=0)?current.media[viewerIndex]:null;\n  const vid=document.getElementById('vwVideo');\n  if(vid){ try{ vid.pause(); }catch(e){} }\n  viewer.classList.remove('open');\n  vwMedia.innerHTML='';\n  $('vwCtrl').style.display='none';\n  if(viewed) invalidateMediaURLs(viewed);\n  viewerIndex=-1;\n  try{ sheetBg.classList.remove('open'); sheetHost.innerHTML=''; }catch(e){}\n  if(current) renderEditorMedia();\n}\n"""
          if old3 not in s:
              raise SystemExit('closeViewer anchor not found')
          s = s.replace(old3, new3, 1)

          p.write_text(s, encoding='utf-8')
      - name: Check JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('silent-camera-safari.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>', s)
          if not m: raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-thumbnail-cache.yml
          git config user.name 'chatgpt-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add silent-camera-safari.html .github/workflows/fix-thumbnail-cache.yml
          git commit -m 'fix: refresh attachment thumbnails after playback'
          git push origin main
