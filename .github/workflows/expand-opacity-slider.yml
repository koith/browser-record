name: Expand opacity slider range
on: [push, workflow_dispatch]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/expand-opacity-slider.py
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('silent-camera-safari.html').read_text()
          assert 'min="0" max="100"' in s
          assert 'width:30px;height:30px' in s
          assert "parseInt(e.target.value,10)||40" not in s
          Path('/tmp/app.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])
          PY
          node --check /tmp/app.js
      - run: |
          rm tools/expand-opacity-slider.py .github/workflows/expand-opacity-slider.yml
          git config user.name chatgpt-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: expand opacity slider to zero and enlarge thumb"
          git push