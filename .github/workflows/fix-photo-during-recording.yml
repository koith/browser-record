name: Fix photo during video recording
on: [push, workflow_dispatch]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix-photo-during-recording.py
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('silent-camera-safari.html').read_text()
          assert "recordingNow=!!(mediaRecorder&&mediaRecorder.state==='recording')" in s
          assert "!recordingNow && typeof ImageCapture" in s
          Path('/tmp/app.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])
          PY
          node --check /tmp/app.js
      - run: |
          rm tools/fix-photo-during-recording.py .github/workflows/fix-photo-during-recording.yml
          git config user.name chatgpt-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve preview when taking photos during recording"
          git push