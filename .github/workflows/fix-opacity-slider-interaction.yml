name: Fix opacity slider interaction
on: [push, workflow_dispatch]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix-opacity-slider-interaction.py
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('silent-camera-safari.html').read_text()
          assert '>.main>.cam-opacity' in s
          assert 'touch-action:pan-x' in s
          Path('/tmp/app.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])
          PY
          node --check /tmp/app.js
      - run: |
          rm tools/fix-opacity-slider-interaction.py .github/workflows/fix-opacity-slider-interaction.yml
          git config user.name chatgpt-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: enable camera opacity slider interaction"
          git push