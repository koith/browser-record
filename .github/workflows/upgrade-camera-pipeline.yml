name: Upgrade Safari camera pipeline
on: [push, workflow_dispatch]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/upgrade-camera-pipeline.py
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('silent-camera-safari.html').read_text()
          for x in ['inspectCameraCapabilities','ImageCapture','startCameraWatchdog','waitForStableFrame','advanced:[{zoom:hv}]','orientationchange']:
              assert x in s, x
          Path('/tmp/app.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])
          PY
          node --check /tmp/app.js
      - run: |
          rm tools/upgrade-camera-pipeline.py .github/workflows/upgrade-camera-pipeline.yml
          git config user.name chatgpt-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: upgrade Safari camera capture pipeline"
          git push